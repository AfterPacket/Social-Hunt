version: "3.8"

# AI features (IOPaint + DeepMosaic) are opt-in to keep the default deployment
# lightweight. Enable both with:
#   docker compose --profile ai up -d
# The main social-hunt container stays on secure Pillow 12 and has no torch.
# It reaches the AI workers over the internal docker network via IOPAINT_URL
# and DEEPMOSAIC_URL, so there is no route or dependency interference.

services:
  social-hunt:
    image: afterpacket/social-hunt:latest
    # To build from source instead of the prebuilt image, uncomment:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: social-hunt
    ports:
      - "8000:8000"
    environment:
      # The admin token used to log into the dashboard and protect settings.
      # This overrides the admin_token in data/settings.json
      # Change this to a secure random string.
      # Example: admin_token=MySecureToken123!
      - admin_token=your_secure_token_here

      # Set to 1 to allow uploading new YAML or Python plugins via the Web UI.
      - SOCIAL_HUNT_ENABLE_WEB_PLUGIN_UPLOAD=1

      # Set to 1 to enable "Bootstrap Mode" which allows setting the admin
      # token via the Web UI if one isn't already configured.
      - SOCIAL_HUNT_ENABLE_TOKEN_BOOTSTRAP=0

      # When the `ai` profile is enabled, point the app at the sibling workers.
      # These are read at startup; the app degrades gracefully if a worker is
      # unreachable. Only set when using --profile ai.
      - IOPAINT_URL=${IOPAINT_URL:-http://iopaint:8080}
      - DEEPMOSAIC_URL=${DEEPMOSAIC_URL:-http://deepmosaic:8081}
      # Onion providers use Tor automatically; clearnet providers stay direct.
      - SOCIAL_HUNT_PROXY=${SOCIAL_HUNT_PROXY:-socks5://tor:9050}

    volumes:
      # Persist search history, settings, and job results
      - ../data:/app/data

      # Persist custom YAML and Python plugins
      - ../plugins:/app/plugins

      # Optional: persist temporary uploads for reverse image search
      - ../web/temp_uploads:/app/web/temp_uploads

    restart: unless-stopped

  # Optional: Nginx reverse proxy (pick one proxy profile: nginx or apache)
  nginx-proxy:
    image: nginx:1.25-alpine
    profiles: ["proxy", "nginx"]
    depends_on:
      - social-hunt
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Optional: Apache reverse proxy (pick one proxy profile: nginx or apache)
  apache-proxy:
    image: httpd:2.4
    profiles: ["proxy", "apache"]
    depends_on:
      - social-hunt
    ports:
      - "80:80"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    restart: unless-stopped

  # Optional: Nginx reverse proxy with SSL (Let's Encrypt or custom certs)
  # Enable with: docker compose --profile ssl up -d
  nginx-ssl:
    image: nginx:1.25-alpine
    profiles: ["ssl", "nginx-ssl"]
    depends_on:
      - social-hunt
      - iopaint
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/certbot/www:/var/www/certbot
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certs:/etc/ssl/custom:ro
    restart: unless-stopped

  # Optional: Let's Encrypt helper (run on demand)
  # Example: docker compose --profile certbot run --rm --service-ports certbot
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    ports:
      - "80:80"
    volumes:
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certbot/www:/var/www/certbot
    env_file:
      - ./ssl/ssl.env
    command: >
      certonly --standalone --preferred-challenges http --http-01-port 80
      --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email -d ${SSL_DOMAIN}

  # ------------------------------------------------------------------
  # AI SERVICES (opt-in via --profile ai)
  # ------------------------------------------------------------------

  # IOPaint inpainting worker. Owns its own torch + Pillow in an
  # isolated container. The main app talks to it via IOPAINT_URL; the IOPaint
  # web UI is exposed directly on port 8080 (open it from the dashboard's
  # "Open IOPaint WebUI" button, which opens http://<host>:8080/).
  # IOPaint 1.6.0 has stale dependency pins, so install security-fixed
  # overrides in this isolated worker rather than inheriting those pins.
  iopaint:
    image: python:3.11-slim
    profiles: ["ai", "ssl"]
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0 &&
             pip install --upgrade pip &&
             pip install iopaint==1.6.0 --no-cache-dir &&
             pip install --upgrade 'Pillow>=12.3.0' 'gradio>=6.0.0' 'diffusers>=0.38.0' 'python-socketio>=5.14.0' 'torch>=2.10.0' 'torchvision>=0.25.0' --no-cache-dir &&
             iopaint start --host 0.0.0.0 --port 8080 --device cpu"
    ports:
      - "8080:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Tor is used only for providers whose target hostname ends in .onion.
  tor:
    build:
      context: ./tor
    profiles: ["ai", "tor"]
    expose:
      - "9050"
    restart: unless-stopped

  # DeepMosaic worker. Built from docker/deepmosaic/Dockerfile; owns torch +
  # the DeepMosaics submodule + model weights. The main app calls it via
  # DEEPMOSAIC_URL. Requires the DeepMosaics submodule to be initialised on
  # the host first:  git submodule update --init DeepMosaics
  deepmosaic:
    build:
      context: ..
      dockerfile: docker/deepmosaic/Dockerfile
    profiles: ["ai"]
    ports:
      - "8081:8081"
    volumes:
      # Persist downloaded model weights so rebuilds don't re-download.
      - ../DeepMosaics/pretrained_models:/app/DeepMosaics/pretrained_models:rw
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
