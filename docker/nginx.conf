map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 0;

    # Social-Hunt API (served under /sh-api). MUST come before the catch-all.
    location /sh-api/ {
        proxy_pass http://social-hunt:8000/sh-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Social-Hunt websocket endpoint
    location /ws {
        proxy_pass http://social-hunt:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Social-Hunt app + static assets
    location / {
        proxy_pass http://social-hunt:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------------
    # OPTIONAL AI SERVICES
    # IOPaint and DeepMosaic run in their own containers and are reached by
    # the main app over the internal docker network (IOPAINT_URL /
    # DEEPMOSAIC_URL), so they do NOT need to be proxied here. The IOPaint web
    # UI is opened directly on its own published port (8080) from the
    # dashboard, which avoids any path interference with Social-Hunt.
    # If you want IOPaint's UI behind this proxy under /iopaint/, uncomment the
    # block below (note: IOPaint's UI expects to be at site root, so its
    # internal /api and /assets calls need an additional rewrite to work under
    # a subpath — the direct-port approach above is simpler and recommended).
    # ------------------------------------------------------------------
    # location /iopaint/ {
    #     proxy_pass http://iopaint:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}